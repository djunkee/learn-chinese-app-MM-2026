<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jiāyóu · Chinese practice</title>
<meta name="theme-color" content="#b93a2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jiāyóu">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#23201c;--mute:#756d62;--line:#e4dccd;--red:#b93a2b;--red2:#8f2a1f;--soft:#f3e2da;--ok:#2f7d4f;--okbg:#e2f1e7;--bad:#b3261e;--badbg:#f8e1de;--gold:#b98a2b}
@media (prefers-color-scheme:dark){:root{--bg:#191614;--card:#24201d;--ink:#f1ebe0;--mute:#a79d8f;--line:#3a332d;--red:#e0604f;--red2:#f08a7a;--soft:#3a2622;--ok:#6cc091;--okbg:#1e3327;--bad:#f08a7a;--badbg:#3d211e;--gold:#e0b458}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.zh{font-family:"Noto Serif SC","Songti SC","Source Han Serif SC","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",serif}
#main{max-width:640px;margin:0 auto;padding:16px 16px 24px}
h1{font-size:1.45rem;margin:0 0 4px}h2{font-size:1.1rem;margin:22px 0 8px}h3{font-size:1rem;margin:0 0 4px}
p{margin:6px 0}.mute{color:var(--mute)}.small{font-size:.86rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1}.center{text-align:center}
button{font:inherit;color:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px 14px;min-height:44px}
button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
button.ghost{background:transparent}
button.link{border:0;background:none;color:var(--red);padding:4px 0;min-height:0;text-decoration:underline}
button:disabled{opacity:.45}
.hero{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.hero img{width:52px;height:52px;border-radius:13px}
.cheer{border-left:4px solid var(--gold);background:var(--card);padding:10px 12px;border-radius:8px;margin:12px 0;font-size:.95rem}
.sess{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sess button{display:flex;flex-direction:column;align-items:center;padding:12px 4px}
.sess b{font-size:1.02rem}.sess span{font-size:.78rem;color:var(--mute)}
.sess button.primary span{color:#fde}
.lessons{display:grid;grid-template-columns:1fr;gap:8px}
.lesson{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.num{flex:none;width:42px;height:42px;border-radius:10px;background:var(--soft);color:var(--red2);display:grid;place-items:center;font-weight:700}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.tok{display:inline-flex;flex-direction:column;align-items:center;margin:2px 3px;vertical-align:bottom}
.tok .p{font-size:.78rem;color:var(--mute);min-height:1.1em}.tok .h{font-size:1.5rem;line-height:1.25}
.big .tok .h{font-size:2.3rem}.big .tok .p{font-size:1rem}
.nopy .tok .p{visibility:hidden}
.word{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.word:first-child{border-top:0}.word .h{font-size:1.5rem;min-width:3.2em}
.spk{flex:none;width:44px;height:44px;border-radius:50%;padding:0;font-size:1.1rem}
.opts{display:grid;gap:8px;margin-top:14px}
.opts button{text-align:left;font-size:1.05rem;padding:12px 14px}
.opts button.ok{background:var(--okbg);border-color:var(--ok)}
.opts button.bad{background:var(--badbg);border-color:var(--bad)}
.opts button.gone{display:none}
.opts .h{font-size:1.4rem}.opts .p{color:var(--mute);font-size:.9rem;margin-left:8px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;padding:8px;border:1px dashed var(--line);border-radius:12px;margin:10px 0;align-items:flex-end}
.tiles button{padding:4px 10px}
.blank{display:inline-block;min-width:2.6em;border-bottom:2px solid var(--red);height:1.9rem}
.fb{border-radius:12px;padding:12px;margin-top:14px}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.prog{height:6px;background:var(--line);border-radius:3px;margin:4px 0 16px}.prog i{display:block;height:100%;background:var(--red);border-radius:3px}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--red2)}
.pat{font-family:ui-monospace,Menlo,monospace;font-size:.86rem;background:var(--soft);border-radius:8px;padding:8px 10px;margin:8px 0;overflow-wrap:anywhere}
details{border-top:1px solid var(--line);padding:10px 0}details:first-of-type{border-top:0}summary{cursor:pointer;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;max-width:128px;text-align:center;padding:9px 2px 8px;color:var(--mute);text-decoration:none;font-size:.74rem}
nav a b{display:block;font-size:1.25rem;font-weight:400;line-height:1.2}
nav a.on{color:var(--red)}
.days{display:flex;gap:4px;align-items:flex-end;height:70px}.days div{flex:1;background:var(--red);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}.days div.z{background:var(--line)}
.daylab{display:flex;gap:4px;font-size:.62rem;color:var(--mute)}.daylab span{flex:1;text-align:center}
input[type=text],select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
label.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 0;gap:12px}
audio{width:100%;margin:4px 0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat b{display:block;font-size:1.5rem}
.tok.tap{cursor:pointer}.tok.tap:active .h{color:var(--red)}
#tip{position:fixed;z-index:20;max-width:260px;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 12px;font-size:.92rem;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none}
#tip b{font-size:1.15rem;margin-right:6px}
#upd{position:fixed;left:0;right:0;top:0;z-index:15;background:var(--card);border-bottom:2px solid var(--gold);padding:12px 16px calc(12px);display:none;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#upd .in{max-width:640px;margin:0 auto}
textarea{font:inherit;width:100%;min-height:84px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.stage{min-height:210px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:22px 14px}
.stage .z{font-size:2.6rem;line-height:1.25}.stage .p{font-size:1.2rem;margin-top:6px}.stage .e{color:var(--mute);margin-top:6px}
.ctl{display:flex;gap:8px;justify-content:center;margin:14px 0}.ctl button{min-width:64px;font-size:1.3rem}.ctl .big{min-width:96px;font-size:1.6rem}
.block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}.block>summary{font-weight:700}
svg.map{width:100%;height:auto;display:block}svg.map text{font-family:inherit}svg.map .tap{cursor:pointer}
.pli{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.pli:first-child{border-top:0}.pli button{min-height:36px;padding:4px 10px}
.daily{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:14px;padding:14px;margin:12px 0}
.ext{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ext button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px}.ext b{font-size:1rem}.ext span{font-size:.78rem;color:var(--mute)}
.line{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.line:first-child{border-top:0}.line .who{flex:none;width:40px;text-align:center;font-weight:700;color:var(--red2)}
.rad{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.rad:first-child{border-top:0}.rad .r{flex:none;width:52px;height:52px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:1.9rem}
.chs span{display:inline-block;font-size:1.5rem;margin-right:6px;cursor:pointer}
.av{flex:none;border-radius:50%;display:block}
#ans button{touch-action:none;user-select:none;-webkit-user-select:none}#ans button.drag{opacity:.9;box-shadow:0 6px 16px rgba(0,0,0,.25);position:relative;z-index:3}#ans button.insl{box-shadow:-4px 0 0 var(--red)}#ans button.insr{box-shadow:4px 0 0 var(--red)}
</style>
</head>
<body>
<div id="upd"></div>
<div id="tip"></div>
<div id="main"></div>
<nav id="nav"></nav>
<script src="data.js"></script>
<script>
'use strict';
/* ---------- storage: one fixed key, versioned schema, never reset on update ---------- */
const KEY='jiayou-progress';           // do not rename: progress lives under this key
// Release history, newest first. The first entry is the running version; keep version.json in step.
const RELEASES=[
 {v:'1.6.0',d:'2026-11-13 12:00',n:['Special days: on holidays in China, France, Germany and Singapore, on Chinese festivals and on your two birthdays, the daily box shows a matching phrase','New special topic: Chinese New Year, with the wishes people say','New dialogue: getting to know Andrei','Progress page lists the next special days']},
 {v:'1.5.3',d:'2026-11-13 00:20',n:['Home screen has one daily box: the word or saying of the day, with the motivational line underneath']},
 {v:'1.5.2',d:'2026-11-13 00:10',n:['Home screen shows your whole waving figure instead of a round head','After a right answer your training partner reacts, with several different figures in rotation; after a wrong one you think it over or your partner explains','End of session: your partner gives the thumbs up and you get your reward']},
 {v:'1.5.1',d:'2026-11-12 23:50',n:['Build the sentence: drag the words in your answer to change their order; a tap still sends a word back']},
 {v:'1.5.0',d:'2026-11-12 23:30',n:['New character set for both learners: Andrei and Moritz each have ten illustrated figures in the same style','Your own figure reacts to your answers, whoever is practising','Figures on matching pages: cycling, running, travelling, food, AI and classroom lessons, stories and the Listen tab']},
 {v:'1.4.1',d:'2026-11-12 23:00',n:['Moritz now appears as illustrated figures with ten expressions: waving on the start screen, thinking when you ask for help, thumbs up or puzzled after an answer, cheering at the end of a good session, and as a speaker in the dialogues']},
 {v:'1.4.0',d:'2026-11-12 22:30',n:['New every day: a word or a Chinese saying of the day at the top of the home screen','HSK 2 section: eight themed lessons with the 123 HSK 2 words the app did not have yet and the new grammar','Stories and dialogues with questions, 14 to start with','Number, time, price and date drills','Characters: 26 building blocks and a recognition quiz','Mock test in exam style: a 15-question mini test and a full 60-question test with timer and score out of 200','My mistakes: redo what you got wrong','Cartoon figures of Moritz and Andrei on the start screen, the home screen and in the dialogues']},
 {v:'1.3.0',d:'2026-11-12 02:00',n:['Home is organised in sections: the course book and special topics, each with a level label (HSK 1 · Basic)','Nine special topics with words, sentences, exercises and audio: cycling, running, sports, football, AI, travelling, geography of China, weather, Christmas','Geography topic explains how China is organised, with two schematic maps you can tap','Listen: build and save playlists of spoken lessons and speaking drills, for example for a one-hour run']},
 {v:'1.2.0',d:'2026-11-12 01:15',n:['Lessons 1–20 added: the app now covers all 40 lessons of New Concept Chinese 1','New Listen tab: a spoken lesson for running, and a say-it-first speaking drill for walking, both hands-free','Listen tab can also play your own book recordings one after another','Daily reminder: add a repeating reminder to your phone calendar from Settings','Short lessons borrow words from the neighbouring lesson so sessions stay full length']},
 {v:'1.1.2',d:'2026-11-12 00:30',n:['Feedback: share notes through the phone\'s share menu or straight into WhatsApp, where you pick the contact','After saving a note on a question you can share it right away']},
 {v:'1.1.1',d:'2026-11-12 00:20',n:['Version number, release date and release notes are shown in Settings','Settings has an Advanced section']},
 {v:'1.1.0',d:'2026-11-12 00:15',n:['Tap any word in a sentence to see pinyin and meaning and hear it','New exercise: what does this sentence mean?','Audio plays automatically for shown words and sentences and for tapped answers','Feedback notes on every question and in Settings','Updates wait until you tap Update, with a backup reminder','Every motivational line has a Chinese phrase with pinyin and audio']},
 {v:'1.0.0',d:'2026-11-11 22:50',n:['First version: New Concept Chinese 1, lessons 21–40','Quick, Standard and Deep sessions, flashcards, grammar drills','Progress, streak and backup on the phone']}
];
const APP_VERSION=RELEASES[0].v, APP_DATE=RELEASES[0].d;
const SCHEMA=1;                        // raise when the shape changes, and add a step in migrate()
function blank(){return {schema:SCHEMA,name:'',buddy:'',settings:{pinyin:true,rate:0.8,auto:true},items:{},days:{},feedback:[],created:today()}}
function migrate(s){
  if(!s||typeof s!=='object')return blank();
  if(!s.schema)s.schema=1;
  // future steps go here, e.g.  if(s.schema<2){ ...convert...; s.schema=2 }
  const b=blank();
  for(const k in b)if(s[k]===undefined)s[k]=b[k];
  for(const k in b.settings)if(s.settings[k]===undefined)s.settings[k]=b.settings[k];
  return s;
}
let S;
function load(){try{S=migrate(JSON.parse(localStorage.getItem(KEY)))}catch(e){S=blank()}}
let saveT;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(saveT);saveT=setTimeout(()=>idbSet('kv','progress',JSON.stringify(S)),400)}
/* IndexedDB: second copy of progress + the user's own audio files */
let dbp;
function db(){return dbp||(dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('jiayou',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('audio')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))}
function idbSet(st,k,v){return db().then(d=>new Promise(res=>{const t=d.transaction(st,'readwrite');t.objectStore(st).put(v,k);t.oncomplete=res;t.onerror=res})).catch(()=>{})}
function idbGet(st,k){return db().then(d=>new Promise(res=>{const r=d.transaction(st).objectStore(st).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)})).catch(()=>null)}
function idbKeys(st){return db().then(d=>new Promise(res=>{const r=d.transaction(st).objectStore(st).getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>res([])})).catch(()=>[])}
function idbClear(st){return db().then(d=>new Promise(res=>{const t=d.transaction(st,'readwrite');t.objectStore(st).clear();t.oncomplete=res})).catch(()=>{})}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayNum(s){return Math.round(Date.parse(s+'T00:00:00Z')/864e5)}
function dayStr(n){return new Date(n*864e5).toISOString().slice(0,10)}
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const PUNCT=/^[，。？！]$/;
const BOOK=BOOKS[0], LESSONS=[].concat(...BOOKS.map(b=>{b.lessons.forEach(L=>{L.b=b});return b.lessons})), DICT=Object.assign({},EXTRA_PY);
const LID=n=>(n>200?'hsk2':n>100?'top':'ncc1')+':'+n;                 // progress ids: do not change
const isTopic=L=>L.b.kind==='topics';
const LT=L=>isTopic(L)?L.en:'Lesson '+L.n;
const NUM=L=>'<span class="num">'+(L.icon||L.n)+'</span>';
const ALLW=[];
LESSONS.forEach(L=>L.W.forEach((w,i)=>{DICT[w[0]]=w[1];ALLW.push({id:'w:'+LID(L.n)+':'+w[0],n:L.n,z:w[0],p:w[1],pos:w[2],e:w[3]})}));
const GL=Object.assign({},window.GLOSS||{});ALLW.forEach(w=>{GL[w.z]=w.e});
if(window.MAP){MAP.cities.concat(MAP.labels).forEach(c=>{DICT[c[0]]=DICT[c[0]]||c[1];GL[c[0]]=GL[c[0]]||c[2]})}
const lessonOf=n=>LESSONS.find(l=>l.n==n);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function sent(L,i){const s=L.S[i];const z=s[0].split(' ');const p=s[1].split(' ').map(x=>x.replace(/_/g,' '));let k=0;const toks=z.map(t=>PUNCT.test(t)?{z:t,p:''}:{z:t,p:p[k++]});return {id:'s:'+LID(L.n)+':'+i,toks,e:s[2],text:z.join(''),py:cap(p.join(' '))}}
function toksHtml(toks,cls){return '<span class="'+(cls||'')+'">'+toks.map(t=>t.blank?'<span class="tok"><span class="p">?</span><span class="blank"></span></span>':(PUNCT.test(t.z)?'<span class="tok">':'<span class="tok tap" data-z="'+esc(t.z)+'" data-p="'+esc(t.p||'')+'" onclick="tip(event,this)">')+'<span class="p">'+esc(t.p||'')+'</span><span class="h zh">'+esc(t.z)+'</span></span>').join('')+'</span>'}
function tip(ev,el){ev.stopPropagation();const z=el.dataset.z,t=$('#tip');t.innerHTML='<b class="zh">'+esc(z)+'</b>'+esc(el.dataset.p||DICT[z]||'')+'<br>'+esc(GL[z]||'');t.style.display='block';const r=el.getBoundingClientRect(),w=t.offsetWidth,h=t.offsetHeight;let x=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2)),y=r.top-h-8;if(y<8)y=r.bottom+8;t.style.left=x+'px';t.style.top=y+'px';speak(z)}
document.addEventListener('click',()=>{const t=$('#tip');if(t)t.style.display='none'});
window.addEventListener('scroll',()=>{const t=$('#tip');if(t)t.style.display='none'},{passive:true});
function wordHtml(z,p,big){return '<span class="'+(big?'big':'')+'"><span class="tok"><span class="p">'+esc(p)+'</span><span class="h zh">'+esc(z)+'</span></span></span>'}

/* ---------- audio: phone voice ---------- */
let voice=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices();voice=v.find(x=>/zh[-_]CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,slow,queue){if(!text||!('speechSynthesis' in window))return;try{if(!queue)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[\s_]/g,''));u.lang='zh-CN';if(voice)u.voice=voice;u.rate=slow?0.55:(S.settings.rate||0.8);speechSynthesis.speak(u)}catch(e){}}
const spk=(t,extra)=>'<button class="spk" aria-label="Listen" onclick="event.stopPropagation();speak(\''+t.replace(/'/g,'')+'\')">🔊</button>'+(extra?'<button class="spk" aria-label="Listen slowly" onclick="event.stopPropagation();speak(\''+t.replace(/'/g,'')+'\',1)">🐢</button>':'');

/* ---------- spaced repetition ---------- */
const GAP=[0,1,2,4,8,16];
function item(id){return S.items[id]||(S.items[id]={b:0,d:0,r:0,w:0})}
function grade(id,ok,helped){const it=item(id),t=dayNum(today());if(ok&&!helped){it.b=Math.min(5,it.b+1);it.r++}else if(!ok){it.b=Math.max(0,it.b-1);it.w++;it.lw=t}it.d=t+(ok?GAP[it.b]:0);it.s=1}
function weight(id){const it=S.items[id],t=dayNum(today());if(!it||!it.s)return 3;if(it.d<=t)return 5-Math.min(it.b,4)+1;return 0.4}
function pickWeighted(list,n,idf){const pool=list.map(x=>({x,k:Math.pow(Math.random(),1/weight(idf(x)))}));pool.sort((a,b)=>b.k-a.k);return pool.slice(0,n).map(o=>o.x)}
function mastery(L){let s=0;L.W.forEach(w=>{const it=S.items['w:'+LID(L.n)+':'+w[0]];s+=it?it.b:0});return s/(L.W.length*5)}
function logDay(q,c,sec){const d=S.days[today()]||(S.days[today()]={q:0,c:0,sec:0,n:0});d.q+=q;d.c+=c;d.sec+=sec;d.n++;save()}
function streak(){let t=dayNum(today()),n=0;if(!S.days[dayStr(t)])t--;while(S.days[dayStr(t)]&&S.days[dayStr(t)].q>0){n++;t--}return n}

/* ---------- question builders ---------- */
const TONE={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù',ü:'ǖǘǚǜ'};
function toneVariants(py){const idx=[];for(let i=0;i<py.length;i++)for(const b in TONE)if(TONE[b].includes(py[i]))idx.push([i,b]);if(!idx.length)return null;const out=new Set();let guard=0;while(out.size<3&&guard++<60){const [i,b]=idx[rnd(idx.length)];const c=TONE[b][rnd(4)];if(c===py[i])continue;out.add(py.slice(0,i)+c+py.slice(i+1))}return out.size===3?[...out]:null}
function others(w,n,scope){const pool=shuffle((scope.length>=8?scope:ALLW).filter(x=>x.z!==w.z&&x.e!==w.e));const seen=new Set(),out=[];for(const x of pool){if(seen.has(x.z))continue;seen.add(x.z);out.push(x);if(out.length===n)break}return out}
function qWord(w,type,scope){
  const o=others(w,3,scope);
  if(type==='tone'){const v=toneVariants(w.p);if(!v)type='h2e';else return {type,id:w.id,title:'Which pinyin is right?',show:'<div class="center nopy">'+wordHtml(w.z,w.p,1)+'</div><p class="center mute">'+esc(w.e)+'</p>',opts:shuffle([{t:w.p,ok:1},...v.map(t=>({t}))]).map(x=>({html:'<span class="h">'+esc(x.t)+'</span>',ok:x.ok})),say:w.z,rev:w,help:'Listen to the word, then choose.',helpSay:true}}
  if(type==='listen')return {type,id:w.id,title:'Listen. What does it mean?',show:'<div class="center">'+spk(w.z,1)+'</div>',auto:w.z,opts:shuffle([w,...o]).map(x=>({html:esc(x.e),ok:x===w})),say:w.z,rev:w,help:'<span class="zh" style="font-size:1.6rem">'+esc(w.z)+'</span> '+esc(w.p)};
  if(type==='e2h')return {type,id:w.id,title:'Choose the Chinese word',show:'<p class="center" style="font-size:1.3rem;margin:18px 0"><b>'+esc(w.e)+'</b></p>',opts:shuffle([w,...o]).map(x=>({html:'<span class="h zh">'+esc(x.z)+'</span><span class="p pyopt">'+esc(x.p)+'</span>',ok:x===w,z:x.z})),say:w.z,rev:w,help:'It sounds like: '+esc(w.p),cut:true};
  return {type:'h2e',id:w.id,auto:w.z,title:'What does it mean?',show:'<div class="center">'+wordHtml(w.z,w.p,1)+'</div><div class="center">'+spk(w.z)+'</div>',opts:shuffle([w,...o]).map(x=>({html:esc(x.e),ok:x===w})),say:w.z,rev:w,cut:true,help:'Two wrong answers removed.'};
}
function qBuild(L,i){const s=sent(L,i);const toks=s.toks.filter(t=>!PUNCT.test(t.z));if(toks.length<3)return null;return {type:'build',id:s.id,title:'Build the sentence',s,toks,order:(()=>{let o;do{o=shuffle(toks.map((_,k)=>k))}while(o.every((v,k)=>v===k));return o})(),picked:[],say:s.text}}
function qRead(L,i,pool){const s=sent(L,i);const seen=new Set([s.e]),o=[];for(const x of shuffle(pool)){const e=x[0].S[x[1]][2];if(seen.has(e))continue;seen.add(e);o.push(e);if(o.length===3)break}if(o.length<3)return null;return {type:'read',auto:s.text,id:'r:'+LID(L.n)+':'+i,title:'What does this sentence mean?',s,show:'<div class="card center">'+toksHtml(s.toks)+'<div style="margin-top:6px">'+spk(s.text,1)+'</div></div><p class="center mute small">Tap any word to see what it means.</p>',opts:shuffle([{e:s.e,ok:1},...o.map(e=>({e}))]).map(x=>({html:esc(x.e),ok:x.ok})),say:s.text,cut:true,help:'Two wrong answers removed.'}}
function qCloze(L,i){const c=L.C[i];const z=c[0].split(' ');const p=c[1].split(' ').map(x=>x.replace(/_/g,' '));let k=0;const toks=z.map(t=>PUNCT.test(t)?{z:t,p:''}:(t==='___'?{blank:1,z:c[3],p:p[k++]}:{z:t,p:p[k++]}));const full=toks.map(t=>t.z).join('');return {type:'cloze',id:'c:'+LID(L.n)+':'+i,title:'Fill in the blank',toks,e:c[2],opts:shuffle([{z:c[3],ok:1},...c[4].map(z=>({z}))]).map(x=>({html:'<span class="h zh">'+esc(x.z)+'</span><span class="p pyopt">'+esc(DICT[x.z]||'')+'</span>',ok:x.ok,z:x.z})),say:full,full,cut:true,help:'Two wrong answers removed.'}}
function makeSession(scope,size,mode){
  const Ls=scope==='all'?LESSONS:[lessonOf(scope)];
  let words=ALLW.filter(w=>scope==='all'||w.n==scope);
  if(scope!=='all'&&+scope<=40&&words.length<8){const n=+scope,pair=n%2?n+1:n-1;words=words.concat(ALLW.filter(w=>w.n===pair))}
  const sents=[],clozes=[];Ls.forEach(L=>{L.S.forEach((_,i)=>sents.push([L,i]));L.C.forEach((_,i)=>clozes.push([L,i]))});
  let nW,nB,nC,nR;size=+size;
  if(mode==='grammar'){nW=0;nC=Math.ceil(size/2);nR=Math.floor(size/4);nB=size-nC-nR}else{nB=Math.round(size*.2);nC=Math.round(size*.2);nR=Math.max(1,Math.round(size*.15));nW=size-nB-nC-nR}
  const qs=[];
  const types=['h2e','e2h','listen','tone','h2e','e2h','listen','e2h'];
  pickWeighted(words,Math.min(nW,words.length),w=>w.id).forEach((w,i)=>qs.push(qWord(w,types[i%types.length],words)));
  pickWeighted(clozes,Math.min(nC,clozes.length),x=>'c:'+LID(x[0].n)+':'+x[1]).forEach(x=>qs.push(qCloze(x[0],x[1])));
  const ps=pickWeighted(sents,Math.min(nB+nR+4,sents.length),x=>'s:'+LID(x[0].n)+':'+x[1]);const used=new Set();let b=0;
  for(const x of ps){if(b>=nB)break;const q=qBuild(x[0],x[1]);if(q){qs.push(q);used.add(x);b++}}
  let r=0;for(const x of ps){if(r>=nR)break;if(used.has(x))continue;const q=qRead(x[0],x[1],sents);if(q){qs.push(q);r++}}
  return shuffle(qs);
}

/* ---------- session runtime ---------- */
let R=null;
const SIZES={quick:{n:8,label:'Quick',time:'about 2 min'},std:{n:16,label:'Standard',time:'about 5 min'},deep:{n:32,label:'Deep',time:'10–12 min'}};
function start(scope,size,mode){const qs=makeSession(scope,SIZES[size]?SIZES[size].n:size,mode);if(!qs.length)return;R={qs,i:0,right:0,t0:Date.now(),scope,size,mode,back:location.hash};if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();location.hash='#/run';render()}
function startQs(qs,again){if(!qs.length)return;R={qs,i:0,right:0,t0:Date.now(),scope:'x',size:qs.length,mode:'',back:location.hash,again};location.hash='#/run';render()}
function showQ(){
  const q=R.qs[R.i];q.done=false;q.helped=q.helped||false;
  let h='<div class="row"><button class="ghost" onclick="quit()">✕</button><div class="grow small mute">Question '+(R.i+1)+' of '+R.qs.length+'</div><button class="ghost" aria-label="Feedback on this question" onclick="fbOpen()">✎</button><button class="ghost" id="helpbtn" onclick="help()">💡 Help</button></div><div class="prog"><i style="width:'+(R.i/R.qs.length*100)+'%"></i></div><h3>'+q.title+'</h3>';
  const py=S.settings.pinyin?'':' nopy';
  if(q.type==='build'){h+='<p style="font-size:1.15rem;margin:14px 0"><b>'+esc(q.s.e)+'</b></p><div class="tiles'+py+'" id="ans"></div><div class="tiles'+py+'" id="bank"></div><button class="primary" style="width:100%" id="check" onclick="checkBuild()">Check</button>'}
  else if(q.type==='cloze'){h+='<div class="card center'+py+'" id="qshow">'+toksHtml(q.toks)+'</div><p class="center"><b>'+esc(q.e)+'</b></p><div class="opts'+py+'" id="opts"></div>'}
  else{h+='<div id="qshow" class="'+((q.type==='h2e'||q.type==='read')&&!S.settings.pinyin?'nopy':'')+'">'+q.show+'</div><div class="opts'+(q.type==='e2h'&&!S.settings.pinyin?' hidepy':'')+'" id="opts"></div>'}
  h+='<div id="helpbox" class="cheer" style="display:none"></div><div id="fbk"></div><div id="fb"></div>';
  $('#main').innerHTML=h;
  if(q.opts)$('#opts').innerHTML=q.opts.map((o,k)=>'<button onclick="pick('+k+')">'+o.html+'</button>').join('');
  if(!S.settings.pinyin)document.querySelectorAll('.pyopt').forEach(e=>e.style.display='none');
  if(q.type==='build')drawTiles();
  if(q.auto&&S.settings.auto)setTimeout(()=>speak(q.auto),250);
  window.scrollTo(0,0);
}
function drawTiles(){const q=R.qs[R.i];const t=k=>'<span class="tok"><span class="p">'+esc(q.toks[k].p)+'</span><span class="h zh">'+esc(q.toks[k].z)+'</span></span>';
  $('#ans').innerHTML=q.picked.map((k,i)=>'<button data-i="'+i+'" onpointerdown="dragStart(event,'+i+')">'+t(k)+'</button>').join('')||'<span class="mute small">Tap the words in the right order. Drag a word to move it, tap it to send it back.</span>';
  $('#bank').innerHTML=q.order.filter(k=>!q.picked.includes(k)).map(k=>'<button onclick="pickTile('+k+')">'+t(k)+'</button>').join('')}
let DR=null;
function dragTarget(x,y,el){const tiles=[...document.querySelectorAll('#ans button')].filter(b=>b!==el);let idx=tiles.length;for(let j=0;j<tiles.length;j++){const r=tiles[j].getBoundingClientRect();if(y<r.top-4||(y<=r.bottom+4&&x<r.left+r.width/2)){idx=j;break}}return {tiles,idx}}
function dragStart(e,i){const q=R&&R.qs[R.i];if(!q||q.done)return;const el=e.currentTarget;DR={i,el,x:e.clientX,y:e.clientY,moved:false};try{el.setPointerCapture(e.pointerId)}catch(err){}
  el.onpointermove=ev=>{if(!DR)return;const dx=ev.clientX-DR.x,dy=ev.clientY-DR.y;if(!DR.moved&&Math.hypot(dx,dy)<8)return;DR.moved=true;el.classList.add('drag');el.style.transform='translate('+dx+'px,'+dy+'px)';const t=dragTarget(ev.clientX,ev.clientY,el);t.tiles.forEach(b=>b.classList.remove('insl','insr'));if(t.tiles.length){if(t.idx<t.tiles.length)t.tiles[t.idx].classList.add('insl');else t.tiles[t.tiles.length-1].classList.add('insr')}DR.to=t.idx};
  el.onpointerup=el.onpointercancel=ev=>{if(!DR)return;const d=DR;DR=null;el.onpointermove=el.onpointerup=el.onpointercancel=null;if(!d.moved||ev.type==='pointercancel'){if(!d.moved)unpick(d.i);else drawTiles();return}const k=q.picked.splice(d.i,1)[0];q.picked.splice(Math.min(d.to===undefined?d.i:d.to,q.picked.length),0,k);drawTiles()}}
function pickTile(k){const q=R.qs[R.i];if(q.done)return;q.picked.push(k);speak(q.toks[k].z);drawTiles()}
function unpick(i){const q=R.qs[R.i];if(q.done)return;q.picked.splice(i,1);drawTiles()}
function checkBuild(){const q=R.qs[R.i];if(q.done)return;if(q.picked.length<q.toks.length){$('#fb').innerHTML='<p class="mute small">Use all the words first.</p>';return}
  const ok=q.picked.map(k=>q.toks[k].z).join('')===q.toks.map(t=>t.z).join('');finish(ok)}
function help(){const q=R.qs[R.i];if(q.done)return;q.helped=true;const hb=$('#helpbox');hb.style.display='flex';hb.style.gap='10px';hb.style.alignItems='center';const say=t=>{hb.innerHTML=myFig('think',76)+'<span>'+t+'</span>'};
  if(q.type==='build'){const next=q.toks.findIndex((t,k)=>q.picked[k]===undefined||q.toks[q.picked[k]].z!==t.z);q.picked=q.picked.slice(0,next);const k=q.order.find(k=>!q.picked.includes(k)&&q.toks[k].z===q.toks[next].z);if(k!==undefined)q.picked.push(k);drawTiles();document.querySelectorAll('.nopy').forEach(e=>e.classList.remove('nopy'));say('Next word placed for you. Pinyin is shown.');return}
  document.querySelectorAll('.nopy').forEach(e=>e.classList.remove('nopy'));document.querySelectorAll('.pyopt').forEach(e=>e.style.display='');
  if(q.cut){const bs=[...document.querySelectorAll('#opts button')];const wrong=shuffle(q.opts.map((o,k)=>o.ok?-1:k).filter(k=>k>=0)).slice(0,2);wrong.forEach(k=>bs[k].classList.add('gone'))}
  say(q.help||'Pinyin is shown.');if(q.helpSay)speak(q.say)}
function pick(k){const q=R.qs[R.i];if(q.done)return;const bs=[...document.querySelectorAll('#opts button')];bs.forEach((b,i)=>{b.disabled=true;if(q.opts[i].ok)b.classList.add('ok')});if(!q.opts[k].ok)bs[k].classList.add('bad');const z=q.opts[k].z;if(z)speak(z);finish(!!q.opts[k].ok,z)}
function finish(ok,said){const q=R.qs[R.i];q.done=true;if(q.id)grade(q.id,ok,q.helped);save();if(ok)R.right++;
  document.querySelectorAll('.nopy').forEach(e=>e.classList.remove('nopy'));document.querySelectorAll('.pyopt').forEach(e=>e.style.display='');

  if(q.type==='build'||q.type==='read')sol=toksHtml(q.s.toks)+'<p>'+esc(q.s.py)+'</p><p class="mute">'+esc(q.s.e)+'</p>';
  else if(q.type==='cloze')sol=toksHtml(q.toks.map(t=>({z:t.z,p:t.p})))+'<p class="mute">'+esc(q.e)+'</p>';
  else if(q.sol)sol=q.sol;
  else sol=wordHtml(q.rev.z,q.rev.p)+' <span style="margin-left:8px">'+esc(q.rev.e)+'</span>';
  $('#fb').innerHTML='<div class="fb '+(ok?'ok':'bad')+'"><div class="row" style="align-items:flex-start">'+reactFig(ok,q.helped,96)+'<div class="grow"><b>'+(ok?(q.helped?'Right, with help':'Right! 对 duì'):'Not quite')+'</b><div style="margin:6px 0">'+sol+'</div></div></div><div class="row">'+spk(q.say,1)+'<button class="primary grow" onclick="next()">'+(R.i+1<R.qs.length?'Next':'Finish')+'</button></div></div>';
  if(S.settings.auto&&said!==q.say)speak(q.say,false,!!said);

function fbOpen(){const el=$('#fbk');if(!el)return;if(el.innerHTML){el.innerHTML='';return}el.innerHTML='<div class="card"><b>Feedback on this question</b><p class="small mute">Something wrong or unclear? Write a note. It is saved on this phone; send all notes later from Settings.</p><textarea id="fbt" placeholder="For example: the translation sounds odd"></textarea><div class="row" style="margin-top:8px"><button class="grow" onclick="$(\'#fbk\').innerHTML=\'\'">Cancel</button><button class="primary grow" onclick="fbSave()">Save note</button></div></div>';$('#fbt').focus()}
function fbSave(ctx){const t=$('#fbt');const text=t?t.value.trim():'';if(!text)return;const q=R?R.qs[R.i]:null;S.feedback.push({d:today(),v:APP_VERSION,who:S.name,ctx:ctx||(q?(q.type+' · '+q.id+' · '+q.say):'general'),text});save();const el=$('#fbk');if(el)el.innerHTML='<p class="small" style="color:var(--ok)">Note saved. Thank you! <button class="link" onclick="fbSend()">Share now</button> or later from Settings.</p>';else render()}

async function fbSend(){if(!S.feedback.length)return;const text=fbText();let done=false;if(navigator.share){try{await navigator.share({title:'Jiāyóu feedback',text});done=true}catch(e){if(e&&e.name==='AbortError')return}}
  if(!done){try{await navigator.clipboard.writeText(text);done=true;alert('Feedback copied. Paste it into a message.')}catch(e){const el=$('#fbout');if(el){el.style.display='block';el.value=text;el.select()}return}}
  S.feedback.forEach(f=>f.sent=1);save();if(!R)render()}

function quit(){if(R&&R.i>0&&!R.ended){const sec=Math.min(Math.round((Date.now()-R.t0)/1000),R.i*60);logDay(R.i,R.right,sec)}const b=R?R.back:'#/';R=null;location.hash=b||'#/';render()}

  $('#main').innerHTML='<div class="center" style="padding-top:20px">'+(pct>=80?budFig('thumbs',170)+' '+myFig(pickOf(['food','sport','travel']),170):(pct>=50?myFig('study',170)+' '+budFig('wave',170):myFig('think',170)+' '+budFig('explain',170)))+'<div class="zh" style="font-size:3.2rem;color:var(--red)">'+(pct>=80?'很好':'加油')+'</div><p class="mute">'+(pct>=80?'hěn hǎo · very good':'jiāyóu · keep going')+'</p><h1>'+r.right+' of '+r.qs.length+' right</h1><p class="mute">'+Math.floor(sec/60)+' min '+(sec%60)+' s · streak '+streak()+' day'+(streak()===1?'':'s')+'</p></div><div class="cheer">'+cheer()+'</div><div class="row"><button class="grow" onclick="'+(r.again||('start(\''+r.scope+'\',\''+r.size+'\',\''+(r.mode||'')+'\')'))+'">Again</button><button class="primary grow" onclick="quit()">Done</button></div>';

function vHome(){
  if(!S.name)return vWho();
  const d=S.days[today()],st=streak();

/* schematic maps for the geography topic */
function mapSVG(kind){const X=lon=>((lon-72)*9.6).toFixed(0),Y=lat=>((54.5-lat)*12).toFixed(0),pts=a=>a.map(p=>X(p[0])+','+Y(p[1])).join(' ');
  const lab=(c,dx,dy,anchor)=>'<g class="tap" data-z="'+esc(c[0])+'" data-p="'+esc(c[1])+'" onclick="tip(event,this)"><text x="'+(+X(c[3])+dx)+'" y="'+(+Y(c[4])+dy)+'" font-size="23" fill="currentColor" text-anchor="'+(anchor||'start')+'" class="zh">'+esc(c[0])+'</text><text x="'+(+X(c[3])+dx)+'" y="'+(+Y(c[4])+dy+15)+'" font-size="13" fill="currentColor" opacity=".65" text-anchor="'+(anchor||'start')+'">'+esc(c[1])+'</text></g>';
  let h='<svg class="map" viewBox="0 0 620 450" role="img" aria-label="Schematic map of China"><polygon points="'+pts(MAP.outline)+'" fill="var(--soft)" stroke="var(--red2)" stroke-width="1.5" stroke-linejoin="round"/><ellipse cx="'+X(109.7)+'" cy="'+Y(19.2)+'" rx="9" ry="7" fill="var(--soft)" stroke="var(--red2)" stroke-width="1.5"/>';
  if(kind==='cities'){const left={'香港':1,'成都':1,'西安':1,'杭州':0};MAP.cities.forEach(c=>{const l=c[0]==='成都'||c[0]==='西安'||c[0]==='广州'||c[0]==='拉萨';const below=c[0]==='香港'||c[0]==='杭州'||c[0]==='重庆';h+='<circle cx="'+X(c[3])+'" cy="'+Y(c[4])+'" r="'+(c[0]==='北京'?6:4)+'" fill="var(--red)"/>'+lab(c,l?-9:(below?6:9),below?24:(l?-8:-6),l?'end':'start')});
    h+='<g font-size="17" fill="currentColor" opacity=".7" text-anchor="middle"><text x="310" y="18">北 běi · north</text><text x="310" y="444">南 nán · south</text><text x="34" y="250">西 xī</text><text x="590" y="250">东 dōng</text></g>'}
  else{h+='<polyline points="'+pts(MAP.wall)+'" fill="none" stroke="#8a6d3b" stroke-width="3" stroke-dasharray="5 3"/><polyline points="'+pts(MAP.yellow)+'" fill="none" stroke="#c9972b" stroke-width="3" stroke-linejoin="round"/><polyline points="'+pts(MAP.yangtze)+'" fill="none" stroke="#3b7fb8" stroke-width="3" stroke-linejoin="round"/>';
    MAP.labels.forEach(c=>{h+=lab(c,0,0,'middle')});h+='<g font-size="16" fill="currentColor" opacity=".7"><text x="20" y="440">west: high plateau</text><text x="600" y="440" text-anchor="end">east: plains and coast</text></g><path d="M190 434 H400" stroke="currentColor" opacity=".5" stroke-width="1.5" marker-end="url(#ar)"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="currentColor" opacity=".5"/></marker></defs>'}
  return h+'</svg>'}
/* book recordings as a playlist */
let PL=null;
async function playBook(n){const keys=(await idbKeys('audio')).map(String).filter(k=>/^\d{2}-/.test(k)&&+k.slice(0,2)>=+n).sort();const el=$('#plbox');if(!el)return;if(!keys.length){el.innerHTML='<p class="small mute">No book recordings for this lesson on this phone. Load your files under Settings → Book audio.</p>';return}
  PL={keys,i:0};el.innerHTML='<p class="small" id="pltxt"></p><audio id="plau" controls></audio><p class="small mute">Recordings keep playing with the screen locked and move on to the next track by themselves.</p>';const au=$('#plau');au.onended=()=>{PL.i++;if(PL.i<PL.keys.length)plLoad(true)};plLoad(true)}
async function plLoad(go){const au=$('#plau');if(!au||!PL)return;const b=await idbGet('audio',PL.keys[PL.i]);au.src=URL.createObjectURL(b);$('#pltxt').textContent='Track '+PL.keys[PL.i]+' ('+(PL.i+1)+' of '+PL.keys.length+')';if(go)au.play().catch(()=>{})}
function vListen(){const n=S.settings.ln||LESSONS[0].n;const opts=LESSONS.map(L=>'<option value="'+L.n+'" '+(L.n==n?'selected':'')+'>'+(isTopic(L)?'Topic':'Lesson '+L.n)+' · '+esc(L.en)+'</option>').join('');const cur=lessonOf(n)||LESSONS[0],nm=esc(LT(cur));
  return '<h1>Listen</h1><div class="row" style="justify-content:center;margin:8px 0">'+fig('m','sport',130)+fig('a','sport',130)+'</div><p class="mute small">Hands-free practice for when your eyes and hands are busy.</p><div class="card"><label class="small mute">Start with</label><select id="ln" onchange="S.settings.ln=+this.value;save();render()">'+opts+'</select></div>'
  +'<div class="card"><h3>🎧 Spoken lesson <span class="tag">for running</span></h3><p class="small">Just listen. Each word and sentence is said in Chinese, then English, then slowly with a pause to repeat. Grammar is explained in English with examples.</p><button class="primary" style="width:100%" onclick="startA(\'lecture\','+n+')">Play '+nm+' · about '+estA('lecture',n)+' min</button></div>'
  +'<div class="card"><h3>🗣 Speaking drill <span class="tag">for walking</span></h3><p class="small">You hear the English, say the Chinese aloud in the pause, then hear the answer twice. No tapping needed.</p><button class="primary" style="width:100%" onclick="startA(\'drill\','+n+')">Start drill: '+nm+' · about '+estA('drill',n)+' min</button></div>'
  +plHtml(n)
  +'<div class="card"><h3>📀 Book recordings</h3><p class="small">Plays your own textbook audio from lesson '+n+' onwards, one track after another.</p><button style="width:100%" onclick="playBook('+n+')">Play recordings from lesson '+n+'</button><div id="plbox" style="margin-top:8px"></div></div>'
  +'<p class="small mute">Both spoken modes carry on with the next lesson by themselves, so one tap can cover a whole run. They use the phone\'s own voices, so the screen has to stay on.</p>'}

/* ---------- updates: nothing changes until the user taps Update ---------- */
let NEWV=null,updHidden=false;
async function checkUpdate(manual){const info=$('#uinfo');try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const v=await r.json();if(v.version&&v.version!==APP_VERSION){NEWV=v;updHidden=false;showUpd();if(info)info.textContent='Version '+v.version+' is available.'}else if(manual&&info)info.textContent='You have the latest version.'}catch(e){if(manual&&info)info.textContent='Could not check. You seem to be offline.'}}
function showUpd(){const el=$('#upd');if(!el)return;if(!NEWV||updHidden||R||F||A||T){el.style.display='none';return}const bk=S.lastBackup===today();
  el.innerHTML='<div class="in"><b>Update available: version '+esc(NEWV.version)+'</b><p class="small" style="margin:4px 0">'+esc(NEWV.notes||'')+'</p><p class="small mute" style="margin:4px 0 8px">Your progress stays on this phone. Save a backup file first, just in case.</p><div class="row wrap"><button class="grow" onclick="exportP();showUpd()">'+(bk?'✓ Backup saved':'1 · Save backup')+'</button><button class="primary grow" onclick="doUpdate()">2 · Update now</button><button class="ghost" onclick="updHidden=true;showUpd()">Later</button></div></div>';el.style.display='block'}
async function doUpdate(){if(S.lastBackup!==today()&&!confirm('Update without saving a backup first?'))return;const el=$('#upd');if(el)el.innerHTML='<div class="in">Updating…</div>';
  try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();const sw=reg&&reg.active;if(sw){await new Promise(res=>{const ch=new MessageChannel();ch.port1.onmessage=res;sw.postMessage({type:'update'},[ch.port2]);setTimeout(res,15000)})}}catch(e){}
  location.reload()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});

/* ---------- router ---------- */
function go(h){location.hash=h}
const TABS=[['#/','家','Home'],['#/listen','听','Listen'],['#/vocab','词','Words'],['#/grammar','文','Grammar'],['#/progress','进','Progress'],['#/settings','设','Settings']];
function render(){const h=location.hash||'#/';const m=$('#main');
  if(h==='#/run'&&R){$('#nav').style.display='none';showUpd();showQ();return}
  if(h==='#/exam'&&T){$('#nav').style.display='none';showUpd();showT();return}
  if(h==='#/play'&&A){$('#nav').style.display='none';showUpd();drawA(true);return}
  if(h==='#/flash'&&F){$('#nav').style.display='none';showUpd();showF();return}
  if(h==='#/done')return;
  $('#nav').style.display=S.name?'flex':'none';
  let v;const lm=h.match(/^#\/lesson\/(\d+)/);
  const sm=h.match(/^#\/story\/(\w+)/);if(lm)v=vLesson(+lm[1]);else if(sm)v=vStory(sm[1]);else if(h==='#/stories')v=vStories();else if(h==='#/numbers')v=vNumbers();else if(h==='#/chars')v=vChars();else if(h==='#/test')v=vTest();else if(h==='#/listen')v=vListen();else if(h==='#/vocab')v=vVocab();else if(h==='#/grammar')v=vGrammar();else if(h==='#/progress')v=vProgress();else if(h==='#/settings')v=vSettings();else v=vHome();
  m.innerHTML=v;const cur=TABS.find(t=>t[0]===h)?h:'#/';
  showUpd();$('#nav').innerHTML=TABS.map(t=>'<a href="'+t[0]+'" class="'+(t[0]===cur?'on':'')+'"><b class="zh">'+t[1]+'</b>'+t[2]+'</a>').join('');window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{if((location.hash==='#/run'&&R)||(location.hash==='#/flash'&&F)||(location.hash==='#/play'&&A)||(location.hash==='#/exam'&&T))return;if(location.hash!=='#/exam'&&T)endT(true);if(location.hash!=='#/play'&&A)stopA(true);if(location.hash!=='#/run')R=null;if(location.hash!=='#/flash'&&location.hash!=='#/done')F=null;render()});

/* ---------- start ---------- */
load();
if(S.lastVersion!==APP_VERSION){S.lastVersion=APP_VERSION;const n=new Date();S.updatedAt=today()+' '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');save()}
(async()=>{ // if the main copy is missing but the second copy exists, restore it
  if(!localStorage.getItem(KEY)){const b=await idbGet('kv','progress');if(b){try{S=migrate(JSON.parse(b));save()}catch(e){}}}
  if(location.hash==='#/run'||location.hash==='#/flash'||location.hash==='#/done'||location.hash==='#/play'||location.hash==='#/exam')location.hash='#/';
  render();checkUpdate();
})();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
